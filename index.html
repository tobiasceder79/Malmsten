<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Malmsten-grenen · Släktbok</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --sw-blue:#006AA7;--sw-gold:#FECC02;--navy:#003D60;
  --male-bg:#EDF5F1;--male-bdr:#2E7D56;
  --female-bg:#FDF0ED;--female-bdr:#B04030;
  --sp-bg:#FEFBF0;--sp-bdr:#C8991A;
  --cream:#FDF9F2;--txt:#1A1A18;--txt2:#404040;--txt3:#808080;
  --line:#C5C0B8;--r:10px;
}
body{background:var(--cream);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  color:var(--txt);min-height:100vh;overflow-x:hidden}

/* HEADER */
.hdr{background:var(--navy);position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,.25)}
.sw-stripe{height:5px;background:linear-gradient(90deg,
  var(--sw-blue) 50%,var(--sw-gold) 50%)}
.hdr-top{display:flex;align-items:center;padding:10px 14px 8px;gap:10px}
.flag-svg{width:28px;height:19px;border-radius:2px;
  box-shadow:0 1px 3px rgba(0,0,0,.3);flex-shrink:0}
.hdr-titles{flex:1;min-width:0}
.hdr-title{font-family:Georgia,serif;font-size:15px;font-weight:normal;
  color:#fff;letter-spacing:.03em;line-height:1.25}
.hdr-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px;
  letter-spacing:.08em;text-transform:uppercase}
.lang-toggle{display:flex;background:rgba(255,255,255,.12);
  border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.2);
  flex-shrink:0}
.lang-btn{padding:5px 10px;font-size:12px;font-weight:600;
  color:rgba(255,255,255,.65);background:none;border:none;
  cursor:pointer;transition:all .15s;line-height:1;letter-spacing:.04em}
.lang-btn.active{background:var(--sw-blue);color:#fff}
.hdr-ctrls{display:flex;gap:6px;padding:4px 14px 9px}
.ctrl{font-size:11px;padding:5px 10px;border:1px solid rgba(255,255,255,.25);
  border-radius:5px;background:rgba(255,255,255,.08);
  color:rgba(255,255,255,.8);cursor:pointer}
.ctrl:active{background:rgba(255,255,255,.22)}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:5px 14px 8px}
.leg{display:flex;align-items:center;gap:4px;font-size:10px;
  color:rgba(255,255,255,.6)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* TREE */
#tree{padding:10px 12px 60px;max-width:540px;margin:0 auto}

/* ROOT ANCESTOR — single top-level banner */
.root-banner{
  display:flex;align-items:center;gap:8px;
  background:var(--navy);color:#fff;
  border-radius:var(--r);padding:9px 12px;
  margin-bottom:6px;cursor:pointer;
  font-family:Georgia,serif;font-size:13px;letter-spacing:.04em;
  box-shadow:0 1px 6px rgba(0,0,0,.15);user-select:none;
  border:2px solid rgba(255,255,255,.15)}
.root-banner:active{background:#002a45}
.rb-sym{width:20px;height:20px;border-radius:50%;
  background:rgba(255,255,255,.2);display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;
  flex-shrink:0;line-height:1;font-family:monospace}
.rb-yr{font-size:10px;opacity:.65;margin-left:3px}
.rb-count{font-size:10px;opacity:.5;margin-left:auto}

/* BRANCH HEADER — per sibling (gen 0) */
.branch-hd{
  display:flex;align-items:center;gap:8px;
  background:var(--sw-blue);color:#fff;
  border-radius:var(--r);padding:9px 12px;
  margin:10px 0 0;cursor:pointer;
  font-family:Georgia,serif;font-size:13px;letter-spacing:.04em;
  box-shadow:0 1px 4px rgba(0,0,0,.12);user-select:none}
.branch-hd:active{background:#005290}
.bh-sym{width:20px;height:20px;border-radius:50%;
  background:rgba(255,255,255,.2);display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;
  flex-shrink:0;line-height:1;font-family:monospace}
.bh-yr{font-size:10px;opacity:.65;margin-left:3px}
.bh-count{font-size:10px;opacity:.5;margin-left:auto}

.branch-body{margin:0}
.branch-body.hidden{display:none}

/* NODE */
.node-wrap{margin-bottom:3px}
.node-row{display:flex;align-items:flex-start;gap:5px}
.children{margin-left:11px;padding-left:14px;
  border-left:2px solid var(--line);margin-top:3px}
.children.hidden{display:none}

/* Toggle button */
.toggle{width:22px;height:22px;flex-shrink:0;margin-top:8px;
  border:1.5px solid var(--line);border-radius:50%;
  background:none;color:var(--txt3);
  font-size:14px;font-weight:700;font-family:monospace;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  line-height:1;transition:all .15s}
.toggle:active{background:rgba(0,100,160,.15)}
.toggle.on{background:var(--sw-blue);border-color:var(--sw-blue);color:#fff}
.toggle.leaf{visibility:hidden;pointer-events:none}

/* PERSON CARD */
.pcard{flex:1;min-width:0;border-radius:var(--r);border:1px solid;
  overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.pcard:active{box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pcard.male  {background:var(--male-bg);border-color:var(--male-bdr)}
.pcard.female{background:var(--female-bg);border-color:var(--female-bdr)}
.pcard.dead  {opacity:.55}
.pc-main{padding:8px 10px 7px}
.pc-tname{font-weight:700;font-size:13px;line-height:1.2}
.pcard.male   .pc-tname{color:var(--male-bdr)}
.pcard.female .pc-tname{color:var(--female-bdr)}
.pc-rest{font-size:11px;color:var(--txt2);margin-top:1px;line-height:1.3}
.pc-dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pc-date{font-size:10px;color:var(--txt3);
  display:flex;align-items:center;gap:2px}
.pc-yrke{font-size:10px;color:var(--txt3);font-style:italic;margin-top:2px}
.sp-divider{height:1px;background:var(--sp-bdr);opacity:.2;margin:0 8px}
.pc-spouse{padding:5px 10px 6px;background:var(--sp-bg);
  display:flex;gap:5px;align-items:flex-start;cursor:pointer}
.sp-sym{font-size:13px;color:var(--sp-bdr);flex-shrink:0;
  margin-top:1px;line-height:1}
.sp-info{flex:1;min-width:0}
.sp-name{font-size:11px;font-weight:600;color:var(--sp-bdr);line-height:1.2}
.sp-nr{font-size:9px;opacity:.7;margin-right:2px}
.sp-dates{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.sp-date{font-size:9px;color:var(--txt3);
  display:flex;align-items:center;gap:2px}

/* DETAIL SHEET */
#overlay{position:fixed;inset:0;background:rgba(0,40,70,.45);
  z-index:200;display:none;align-items:flex-end}
#overlay.open{display:flex}
#sheet{background:#fff;border-radius:18px 18px 0 0;
  padding:14px 16px 36px;width:100%;max-height:78vh;
  overflow-y:auto;box-shadow:0 -4px 24px rgba(0,0,0,.2);position:relative}
.handle{width:40px;height:4px;background:var(--line);
  border-radius:2px;margin:0 auto 14px}
.det-tname{font-family:Georgia,serif;font-size:20px;
  color:var(--navy);line-height:1.2}
.det-sub{font-size:13px;color:var(--txt2);margin-bottom:12px}
.det-tbl{width:100%;border-collapse:collapse;font-size:13px}
.det-tbl td{padding:6px 0;border-bottom:1px solid #EDE9E0;vertical-align:top}
.det-tbl td:first-child{color:var(--txt3);width:100px;
  padding-right:8px;font-size:12px}
.det-bet{display:inline-block;background:var(--navy);color:#fff;
  font-size:9px;padding:2px 7px;border-radius:3px;
  font-family:monospace;margin-top:8px}
#close-btn{position:absolute;top:14px;right:14px;background:none;
  border:none;font-size:22px;color:var(--txt3);cursor:pointer;padding:4px}
.det-div{height:1px;background:var(--line);opacity:.3;margin:10px 0}
.det-sp-hd{font-size:11px;color:var(--sp-bdr);font-weight:600;
  margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
</style>
</head>
<body>

<div class="hdr">
  <div class="sw-stripe"></div>
  <div class="hdr-top">
    <svg class="flag-svg" viewBox="0 0 16 11" xmlns="http://www.w3.org/2000/svg">
      <rect width="16" height="11" fill="#006AA7"/>
      <rect x="5" width="2" height="11" fill="#FECC02"/>
      <rect y="4.5" width="16" height="2" fill="#FECC02"/>
    </svg>
    <div class="hdr-titles">
      <div class="hdr-title" id="hdr-title">Malmsten-grenen</div>
      <div class="hdr-sub" id="hdr-sub">Östgötsk och Småländsk Släktbok</div>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-sv" onclick="setLang('sv')">SV</button>
      <button class="lang-btn"        id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
  <div class="hdr-ctrls">
    <button class="ctrl" id="btn-expand"   onclick="expandAll()">Expandera alla</button>
    <button class="ctrl" id="btn-collapse" onclick="collapseAll()">Stäng alla</button>
  </div>
  <div class="legend">
    <div class="leg">
      <div class="leg-dot" style="background:var(--male-bg);border:1.5px solid var(--male-bdr)"></div>
      <span id="leg-man">Man</span>
    </div>
    <div class="leg">
      <div class="leg-dot" style="background:var(--female-bg);border:1.5px solid var(--female-bdr)"></div>
      <span id="leg-woman">Kvinna</span>
    </div>
    <div class="leg">
      <div class="leg-dot" style="background:var(--sp-bg);border:1.5px dashed var(--sp-bdr)"></div>
      <span id="leg-married">Ingift ⚭</span>
    </div>
    <div class="leg">
      <div class="leg-dot" style="background:#ccc;opacity:.5;border:1px solid #999"></div>
      <span id="leg-deceased">Avliden</span>
    </div>
  </div>
</div>

<div id="tree"></div>

<div id="overlay" onclick="overlayClick(event)">
  <div id="sheet">
    <div class="handle"></div>
    <button id="close-btn" onclick="closeSheet()">×</button>
    <div id="det-body"></div>
  </div>
</div>

/* ── INDEX ── */
const byBet      = {};
DATA.people.forEach(p => { if(p.bet) byBet[p.bet] = p; });

const childrenOf = DATA.children_of;

/* ── STATE: everything starts CLOSED ── */
// rootOpen: the single ancestor banner
// branchOpen: each gen-0 sibling
// nodeOpen: all deeper nodes
const rootOpen   = new Set();   // empty → AUGUSTA's section closed
const branchOpen = new Set();   // empty → all sibling branches closed
const nodeOpen   = new Set();   // empty → all deeper nodes collapsed

/* ── HELPERS ── */
function yr(d){
  if(!d) return '';
  const s = String(d).replace(/[^0-9?]/g,'');
  return s.length>=4 ? s.slice(0,4) : String(d).trim();
}
function dateStr(d){
  if(!d) return '';
  const s = String(d).replace(/[^0-9]/g,'');
  if(s.length===8) return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
  return String(d).trim();
}
function tilltals(fn){
  if(!fn) return '';
  const m = fn.match(/\b([A-ZÅÄÖ]{2,}(?:\s+[A-ZÅÄÖ]{2,})*)\b/);
  if(m) return m[1].split(' ').slice(0,2).join(' ');
  return fn.split(' ')[0];
}
function restName(fn){ return fn.replace(tilltals(fn),'').trim(); }
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function trunc(s,n){ return s&&s.length>n ? s.slice(0,n-1)+'…':(s||''); }
function hasKids(bet){ return !!(childrenOf[bet]&&childrenOf[bet].length); }

/* ── DATES HTML ── */
function datesHTML(fodd,dod,small){
  const cls=small?'sp-date':'pc-date'; let out='';
  const fy=yr(fodd),dy=yr(dod);
  if(fy) out+=`<span class="${cls}"><span>🌱</span>${fy}</span>`;
  if(dy) out+=`<span class="${cls}"><span>✝</span>${dy}</span>`;
  return out;
}

/* ── PERSON CARD HTML ── */
function cardHTML(bet){
  const p=byBet[bet]; if(!p) return '';
  const gc=p.kon==='M'?'male':'female';
  const deadC=p.dod?' dead':'';
  const tname=esc(trunc(tilltals(p.fn),18));
  const rest=esc(trunc(restName(p.fn),22));
  const sname=p.en&&p.en!=='Malmsten'?esc(trunc(p.en,14)):'';
  const yrke=p.yrke?esc(trunc(p.yrke,28)):'';
  const sps=spousesOf[bet]||[];

  let h=`<div class="pcard ${gc}${deadC}">
  <div class="pc-main" onclick="showDetail('${esc(bet)}')">
    <div class="pc-tname">${tname}</div>
    ${rest||sname?`<div class="pc-rest">${rest}${rest&&sname?' ':''}${sname}</div>`:''}
    <div class="pc-dates">${datesHTML(p.fodd,p.dod,false)}</div>
    ${yrke?`<div class="pc-yrke">${yrke}</div>`:''}
  </div>`;

  sps.forEach((sp,si)=>{
    const spT=esc(trunc(tilltals(sp.fn),16));
    const spR=esc(trunc(restName(sp.fn),18));
    const spSn=sp.en&&sp.en!=='Malmsten'?esc(trunc(sp.en,12)):'';
    const spNr=sps.length>1?`<span class="sp-nr">g${sp.gift_nr||si+1}</span>`:'';
    h+=`<div class="sp-divider"></div>
  <div class="pc-spouse" onclick="showSpouse(${si},'${esc(bet)}',event)">
    <div class="sp-sym">⚭</div>
    <div class="sp-info">
      <div class="sp-name">${spNr}${spT}${spR?' '+spR:''}${spSn?' '+spSn:''}</div>
      <div class="sp-dates">${datesHTML(sp.fodd,sp.dod,true)}</div>
    </div>
  </div>`;
  });
  return h+'</div>';
}

/* ── RENDER NODE (depth ≥ 1, i.e. gen-0 siblings and below) ── */
function renderNode(bet,depth){
  const hc=hasKids(bet);
  const isOp=nodeOpen.has(bet);
  const tCls=hc?(isOp?'on':''):'leaf';
  const tSym=hc?(isOp?'−':'+'):'·';

  let h=`<div class="node-wrap">
<div class="node-row">
  <button class="toggle ${tCls}" data-bet="${esc(bet)}"
    onclick="toggleNode('${esc(bet)}')">${tSym}</button>
  ${cardHTML(bet)}
</div>`;
  if(hc){
    h+=`<div class="children ${isOp?'':'hidden'}" id="ch_${esc(bet)}">`;
    (childrenOf[bet]||[]).forEach(cb=>{ h+=renderNode(cb,depth+1); });
    h+='</div>';
  }
  return h+'</div>';
}

  const kids=childrenOf[bet]||[];
  const gc=p.kon==='M'?'male':'female';
  const deadC=p.dod?' dead':'';
  const sps=spousesOf[bet]||[];

  let h=`<div class="branch-hd" onclick="toggleBranch('${esc(bet)}')">
  <div class="bh-sym" id="bsym_${esc(bet)}">${isOp?'−':'+'}</div>
  <span>${esc(tname)}${sname?' '+esc(sname):''}</span>
  ${yrs?`<span class="bh-yr">${yrs}</span>`:''}
  ${kids.length?`<span class="bh-count">${kids.length} ${t('children')}</span>`:''}
</div>
<div class="branch-body ${isOp?'':'hidden'}" id="bb_${esc(bet)}">`;

  // Sibling's own card (leaf node — no toggle)
  const tname2=esc(trunc(tilltals(p.fn),20));
  const rest2=esc(trunc(restName(p.fn),24));
  const sname2=p.en&&p.en!=='Malmsten'?esc(p.en):'';

  h+=`<div class="node-wrap">
<div class="node-row">
  <button class="toggle leaf" aria-hidden="true">·</button>
  <div class="pcard ${gc}${deadC}">
    <div class="pc-main" onclick="showDetail('${esc(bet)}')">
      <div class="pc-tname">${tname2}</div>
      ${rest2||sname2?`<div class="pc-rest">${rest2}${rest2&&sname2?' ':''}${sname2}</div>`:''}
      <div class="pc-dates">${datesHTML(p.fodd,p.dod,false)}</div>
      ${p.yrke?`<div class="pc-yrke">${esc(trunc(p.yrke,28))}</div>`:''}
    </div>`;

  sps.forEach((sp,si)=>{
    const spT=esc(trunc(tilltals(sp.fn),16));
    const spR=esc(trunc(restName(sp.fn),18));
    const spSn=sp.en&&sp.en!=='Malmsten'?esc(trunc(sp.en,12)):'';
    const spNr=sps.length>1?`<span class="sp-nr">g${sp.gift_nr||si+1}</span>`:'';
    h+=`<div class="sp-divider"></div>
    <div class="pc-spouse" onclick="showSpouse(${si},'${esc(bet)}',event)">
      <div class="sp-sym">⚭</div>
      <div class="sp-info">
        <div class="sp-name">${spNr}${spT}${spR?' '+spR:''}${spSn?' '+spSn:''}</div>
        <div class="sp-dates">${datesHTML(sp.fodd,sp.dod,true)}</div>
      </div>
    </div>`;
  });
  h+=`</div></div></div>`;

  if(kids.length){
    h+=`<div class="children" id="ch_${esc(bet)}">`;
    kids.forEach(cb=>{ h+=renderNode(cb,1); });
    h+='</div>';
  }
  return h+'</div>'; // close branch-body
}

/* ── RENDER ANCESTOR BANNER (AUGUSTA) ── */
function renderRoot(bet){
  const p=byBet[bet]; if(!p) return '';
  const isOp=rootOpen.has(bet);
  const tname=esc(tilltals(p.fn));
  const rest=esc(restName(p.fn));
  const sname=p.en&&p.en!=='Malmsten'?esc(p.en):'';
  const fy=yr(p.fodd),dy=yr(p.dod);
  const yrs=fy?(dy?fy+'–'+dy:fy):'';
  const kids=childrenOf[bet]||[];

  let h=`<div class="root-banner" onclick="toggleRoot('${esc(bet)}')">
  <div class="rb-sym" id="rsym_${esc(bet)}">${isOp?'−':'+'}</div>
  <span style="font-size:14px">${tname}${rest?' '+rest:''}</span>
  ${sname?`<span style="font-size:11px;opacity:.7"> ${sname}</span>`:''}
  ${yrs?`<span class="rb-yr">${yrs}</span>`:''}
  ${kids.length?`<span class="rb-count">${kids.length} ${t('children')}</span>`:''}
</div>
<div class="${isOp?'':'hidden'}" id="rb_${esc(bet)}" style="padding-left:8px">`;

  // Her own spouses if any
  const sps=spousesOf[bet]||[];
  if(sps.length){
    h+=`<div style="margin-bottom:6px">`;
    sps.forEach((sp,si)=>{
      const spT=esc(trunc(tilltals(sp.fn),16));
      const spR=esc(trunc(restName(sp.fn),18));
      const spSn=sp.en&&sp.en!=='Malmsten'?esc(trunc(sp.en,12)):'';
      const spNr=sps.length>1?`<span class="sp-nr">g${sp.gift_nr||si+1}</span>`:'';
      h+=`<div style="display:flex;gap:5px;align-items:center;margin-bottom:3px">
        <span style="color:var(--sp-bdr);font-size:13px">⚭</span>
        <div style="font-size:12px;color:var(--sp-bdr);font-weight:600">
          ${spNr}${spT}${spR?' '+spR:''}${spSn?' '+spSn:''}
          ${datesHTML(sp.fodd,sp.dod,true)}
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  // Children = the 5 siblings, each as a sibling branch
  kids.forEach(cb=>{ h+=renderSiblingBranch(cb); });

  return h+'</div>';
}

/* ── BUILD TREE ── */
function buildTree(){
  let h='';
  roots.forEach(bet=>{ if(byBet[bet]) h+=renderRoot(bet); });
  document.getElementById('tree').innerHTML=h;
}
buildTree();

/* ── TOGGLE ROOT (AUGUSTA banner) ── */
function toggleRoot(bet){
  const rb  =document.getElementById('rb_'+bet);
  const rsym=document.getElementById('rsym_'+bet);
  if(!rb) return;
  if(rootOpen.has(bet)){
    rootOpen.delete(bet);
    rb.classList.add('hidden');
    if(rsym) rsym.textContent='+';
  } else {
    rootOpen.add(bet);
    rb.classList.remove('hidden');
    if(rsym) rsym.textContent='−';
  }
}

/* ── TOGGLE SIBLING BRANCH ── */
function toggleBranch(bet){
  const bb  =document.getElementById('bb_'+bet);
  const bsym=document.getElementById('bsym_'+bet);
  if(!bb) return;
  if(branchOpen.has(bet)){
    branchOpen.delete(bet);
    bb.classList.add('hidden');
    if(bsym) bsym.textContent='+';
  } else {
    branchOpen.add(bet);
    bb.classList.remove('hidden');
    if(bsym) bsym.textContent='−';
    // Also restore gen-1 children (collapseAll hides them separately)
    const ch=document.getElementById('ch_'+bet);
    if(ch) ch.classList.remove('hidden');
    nodeOpen.add(bet);
  }
}

/* ── TOGGLE NODE ── */
function toggleNode(bet){
  const ch =document.getElementById('ch_'+bet);
  const btn=document.querySelector(`[data-bet="${CSS.escape(bet)}"]`);
  if(!ch) return;
  if(nodeOpen.has(bet)){
    nodeOpen.delete(bet);
    ch.classList.add('hidden');
    if(btn){btn.classList.remove('on');btn.textContent='+';}
  } else {
    nodeOpen.add(bet);
    ch.classList.remove('hidden');
    if(btn){btn.classList.add('on');btn.textContent='−';}
  }
}

/* ── EXPAND ALL ── */
function expandAll(){
  // Open AUGUSTA
  roots.forEach(bet=>{
    rootOpen.add(bet);
    const rb  =document.getElementById('rb_'+bet);
    const rsym=document.getElementById('rsym_'+bet);
    if(rb)   rb.classList.remove('hidden');
    if(rsym) rsym.textContent='−';
  });
  // Open all sibling branches
  DATA.people.forEach(p=>{
    if(!p.bet||p.gen!==0) return;
    branchOpen.add(p.bet);
    const bb  =document.getElementById('bb_'+p.bet);
    const bsym=document.getElementById('bsym_'+p.bet);
    if(bb)   bb.classList.remove('hidden');
    if(bsym) bsym.textContent='−';
  });
  // Open all deeper nodes
  DATA.people.forEach(p=>{
    if(!p.bet||!hasKids(p.bet)) return;
    nodeOpen.add(p.bet);
    const ch =document.getElementById('ch_'+p.bet);
    const btn=document.querySelector(`[data-bet="${CSS.escape(p.bet)}"]`);
    if(ch)  ch.classList.remove('hidden');
    if(btn){btn.classList.add('on');btn.textContent='−';}
  });
}

/* ── COLLAPSE ALL ── */
function collapseAll(){
  // Close AUGUSTA
  roots.forEach(bet=>{
    rootOpen.delete(bet);
    const rb  =document.getElementById('rb_'+bet);
    const rsym=document.getElementById('rsym_'+bet);
    if(rb)   rb.classList.add('hidden');
    if(rsym) rsym.textContent='+';
  });
  // Close all sibling branches
  DATA.people.forEach(p=>{
    if(!p.bet||p.gen!==0) return;
    branchOpen.delete(p.bet);
    const bb  =document.getElementById('bb_'+p.bet);
    const bsym=document.getElementById('bsym_'+p.bet);
    if(bb)   bb.classList.add('hidden');
    if(bsym) bsym.textContent='+';
  });
  // Close all deeper nodes
  DATA.people.forEach(p=>{
    if(!p.bet||!hasKids(p.bet)) return;
    nodeOpen.delete(p.bet);
    const ch =document.getElementById('ch_'+p.bet);
    const btn=document.querySelector(`[data-bet="${CSS.escape(p.bet)}"]`);
    if(ch)  ch.classList.add('hidden');
    if(btn){btn.classList.remove('on');btn.textContent='+';}
  });
}

/* ── DETAIL SHEET ── */
function rowH(label,val,icon){
  if(!val) return '';
  return `<tr><td>${esc(label)}</td><td>${icon?icon+' ':''}${esc(val)}</td></tr>`;
}

function showDetail(bet){
  const p=byBet[bet]; if(!p) return;
  const sps  =spousesOf[bet]||[];
  const kids =(childrenOf[bet]||[]).map(b=>byBet[b]).filter(Boolean);
  const parent=p.for_bet?byBet[p.for_bet]:null;
  const col  =p.kon==='M'?'var(--male-bdr)':'var(--female-bdr)';

  let body=`<div class="det-tname" style="color:${col}">${esc(tilltals(p.fn))}</div>
<div class="det-sub">${esc(restName(p.fn))}${p.en&&p.en!=='Malmsten'?' · '+esc(p.en):''}</div>
<table class="det-tbl">
${rowH(t('born'),      dateStr(p.fodd),'🌱')}
${rowH(t('died'),      dateStr(p.dod), '✝')}
${rowH(t('domicile'),  p.ort,'')}
${rowH(t('occupation'),p.yrke,'')}
${parent?rowH(t('parent'),tilltals(parent.fn)+' '+(parent.en||''),''):''}
${kids.length?rowH(t('children_lbl'),kids.map(k=>tilltals(k.fn)+(k.dod?'†':'')).join(', '),'👶'):''}
</table>
${p.bet&&!p.bet.startsWith('_syn_')?`<div class="det-bet">${esc(p.bet)}</div>`:''}`;

  sps.forEach((sp,si)=>{
    const spLabel=sps.length>1?` (g${sp.gift_nr||si+1})`:'';
    body+=`<div class="det-div"></div>
<div class="det-sp-hd">⚭ ${t('spouse')}${esc(spLabel)}</div>
<table class="det-tbl">
${rowH(t('born'),      dateStr(sp.fodd),'🌱')}
${rowH(t('died'),      dateStr(sp.dod), '✝')}
${rowH(t('occupation'),sp.yrke,'')}
${rowH(t('domicile'),  sp.ort,'')}
</table>`;
  });

  document.getElementById('det-body').innerHTML=body;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').scrollTop=0;
}

function showSpouse(si,bet,e){
  e.stopPropagation();
  const sps=spousesOf[bet]||[];
  const sp=sps[si]; if(!sp) return;
  const partner=byBet[bet];

  let body=`<div class="det-tname" style="color:var(--sp-bdr)">${esc(tilltals(sp.fn))}</div>
<div class="det-sub">${esc(restName(sp.fn))}${sp.en&&sp.en!=='Malmsten'?' · '+esc(sp.en):''} <span style="font-size:11px;color:var(--txt3)">(${t('inmarried')})</span></div>
<table class="det-tbl">
${rowH(t('born'),      dateStr(sp.fodd),'🌱')}
${rowH(t('died'),      dateStr(sp.dod), '✝')}
${rowH(t('occupation'),sp.yrke,'')}
${rowH(t('domicile'),  sp.ort,'')}
${partner?rowH(t('marriedTo'),tilltals(partner.fn)+' '+(partner.en||''),'⚭'):''}
</table>`;

  document.getElementById('det-body').innerHTML=body;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').scrollTop=0;
}

function overlayClick(e){
  if(e.target===document.getElementById('overlay')) closeSheet();
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
}
</script>
